<!DOCTYPE html>
<!-- Bir kerelik: 1.0.x ayarları file:///android_asset kökenindeydi; yeni arayüz https://tvbakim.local'da. Okunup köprüye verilir. -->
<html><head><meta charset="utf-8"><style>html,body{margin:0;height:100%;background:#0b1220}</style></head><body><script>
(function () {
  var o = {};
  try { ['tv.dil', 'tv.oto', 'tv.son', 'tv.kur'].forEach(function (k) { var v = localStorage.getItem(k); if (v != null) o[k] = String(v).slice(0, 200); }); } catch (e) {}
  try { window.TV.tasi(JSON.stringify(o)); } catch (e) {}
})();
</script></body></html>
